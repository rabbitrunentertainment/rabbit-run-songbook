<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rabbit Run Song Requests</title>

  <style>
    body {
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #d8b4fe;
      margin-bottom: 30px;
    }

    #requests {
      max-width: 900px;
      margin: auto;
    }

    .request {
      background: #1f2937;
      border: 2px solid #7c3aed;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .singer {
      font-size: 24px;
      font-weight: bold;
    }

    .song {
      font-size: 20px;
      margin-top: 6px;
    }

    .artist {
      color: #cbd5e1;
      margin-top: 4px;
    }

    .status {
      color: #f9a8d4;
      margin-top: 8px;
      font-weight: bold;
    }
    .warning {
  color: #fbbf24;
  font-weight: bold;
  margin-top: 6px;
  font-size: 14px;
}
  </style>
</head>

<body>

  <h1>🎤 Song Requests</h1>
  <div class="subtitle">Rabbit Run Entertainment</div>

  <div id="requests">Loading requests...</div>

  <script>
      const SUPABASE_URL = "https://cpprxqlevftbgpjjfgnz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_HeuQI_aKycIu8i8TUBNP-A_7bHnRwp3";

    async function loadRequests() {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/requests?select=*&order=created_at.asc`,
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      const data = await response.json();
      const container = document.getElementById("requests");

      if (!response.ok) {
        container.innerHTML = "Could not load requests.";
        return;
      }

      if (data.length === 0) {
        container.innerHTML = "No song requests yet.";
        return;
      }

      const formatTime = (timestamp) => {
  return new Date(timestamp).toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });
};
      const namesByDevice = {};

data.forEach(request => {
  if (!request.singer_id) return;

  if (!namesByDevice[request.singer_id]) {
    namesByDevice[request.singer_id] = new Set();
  }

  namesByDevice[request.singer_id].add(
    request.singer_name.trim().toLowerCase()
  );
});

const mismatchedDevices = new Set(
  Object.entries(namesByDevice)
    .filter(([id, names]) => names.size > 1)
    .map(([id]) => id)
);
container.innerHTML = data
  .filter(request => request.status !== "completed")
  .map(request => `
    <div class="request">
      <div class="singer">${request.singer_name}</div>
      ${request.original_name &&
request.original_name.toLowerCase() !== request.singer_name.toLowerCase()
  ? `<div class="warning">⚠️ Originally: ${request.original_name}</div>`
  : ''}
      ${mismatchedDevices.has(request.singer_id)
  ? '<div class="warning">⚠️ NAME MISMATCH - SAME DEVICE</div>'
  : ''}
      <div class="song">${request.song_title}</div>
      <div class="artist">${request.artist || ""}</div>
      <div class="status">${request.status || "waiting"}</div>
      <div class="time">${formatTime(request.created_at)}</div>

      <div class="controls">
        <button onclick="updateStatus(${request.id}, 'up_next')">
          Up Next
        </button>

        <button onclick="removeRequest(${request.id})">
    Done
</button>
      </div>
    </div>
  `).join("");
    }
        loadRequests();
    async function updateStatus(id, newStatus) {
  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/requests?id=eq.${id}`,
    {
      method: "PATCH",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        status: newStatus
      })
    }
  );

  if (!response.ok) {
    alert("Could not update this request.");
    return;
  }

  loadRequests();
}

async function removeRequest(id) {
  const confirmed = confirm("Remove this song request?");

  if (!confirmed) return;

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/requests?id=eq.${id}`,
    {
      method: "DELETE",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    }
  );

  if (!response.ok) {
    alert("Could not remove this request.");
    return;
  }

  loadRequests();
}

    setInterval(loadRequests, 5000);
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rabbit Run Song Requests</title>

  <style>
    body {
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #d8b4fe;
      margin-bottom: 30px;
    }

    #requests {
      max-width: 900px;
      margin: auto;
    }

    .request {
      background: #1f2937;
      border: 2px solid #7c3aed;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .singer {
      font-size: 24px;
      font-weight: bold;
    }

    .song {
      font-size: 20px;
      margin-top: 6px;
    }

    .artist {
      color: #cbd5e1;
      margin-top: 4px;
    }

    .status {
      color: #f9a8d4;
      margin-top: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🎤 Song Requests</h1>
  <div class="subtitle">Rabbit Run Entertainment</div>

  <div id="requests">Loading requests...</div>

  <script>
      const SUPABASE_URL = "https://cpprxqlevftbgpjjfgnz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_HeuQI_aKycIu8i8TUBNP-A_7bHnRwp3";

    async function loadRequests() {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/requests?select=*&order=created_at.asc`,
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      const data = await response.json();
      const container = document.getElementById("requests");

      if (!response.ok) {
        container.innerHTML = "Could not load requests.";
        return;
      }

      if (data.length === 0) {
        container.innerHTML = "No song requests yet.";
        return;
      }

      container.innerHTML = data.map(request => `
        <div class="request">
          <div class="singer">${request.singer_name}</div>
          <div class="song">${request.song_title}</div>
          <div class="artist">${request.artist || ""}</div>
          <div class="status">${request.status || "waiting"}</div>
        </div>
      `).join("");
    }
        loadRequests();

    setInterval(loadRequests, 5000);
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rabbit Run Song Requests</title>

  <style>
    body {
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin: 0 0 2px;
    }

    .subtitle {
      text-align: center;
      color: #d8b4fe;
      margin-bottom: 14px;
      font-size: 13px;
    }

    #requests {
      max-width: 1100px;
      margin: auto;
    }

    .request {
      background: #1f2937;
      border: 2px solid #7c3aed;
      border-radius: 9px;
      padding: 8px 10px;
      margin-bottom: 6px;

      display: grid;
      grid-template-columns:
        minmax(110px, 0.8fr)
        minmax(180px, 1.6fr)
        minmax(140px, 1.3fr)
        85px
        75px
        auto;

      gap: 10px;
      align-items: center;
    }

    .request.up-next {
      border-width: 3px;
    }

    .singer {
      font-size: 16px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .song {
      font-size: 15px;
      font-weight: bold;
    }

    .artist {
      color: #cbd5e1;
      font-size: 14px;
    }

    .status {
      color: #f9a8d4;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 12px;
    }

    .time {
      color: #cbd5e1;
      font-size: 12px;
    }

    .warnings {
      grid-column: 1 / -1;
    }

    .warning {
      color: #fbbf24;
      font-weight: bold;
      font-size: 12px;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    @media (max-width: 750px) {

      .request {
        display: block;
        padding: 10px;
      }

      .singer {
        font-size: 18px;
      }

      .song {
        margin-top: 4px;
      }

      .artist,
      .status,
      .time {
        margin-top: 3px;
      }

      .controls {
        justify-content: flex-start;
        margin-top: 7px;
      }

      .warnings {
        margin-top: 4px;
      }
    }
  </style>
</head>

<body>

  <h1>🎤 Song Requests</h1>
  <div class="subtitle">Rabbit Run Entertainment</div>

  <div id="requests">
    Loading requests...
  </div>

  <script>

    const SUPABASE_URL =
      "https://cpprxqlevftbgpjjfgnz.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_HeuQI_aKycIu8i8TUBNP-A_7bHnRwp3";


    /* SAFE DISPLAY TEXT */

    const escapeHtml = value =>
      String(value ?? "").replace(
        /[&<>"']/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[character])
      );


    /* FORMAT REQUEST TIME */

    function formatTime(timestamp) {

      return new Date(timestamp)
        .toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit"
        });

    }


    /* LOAD REQUESTS */

    async function loadRequests() {

      const container =
        document.getElementById("requests");

      try {

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/requests?select=*&order=created_at.asc`,
          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                `Bearer ${SUPABASE_KEY}`
            }
          }
        );


        if (!response.ok) {

          const errorText =
            await response.text();

          console.error(
            "Could not load requests:",
            response.status,
            errorText
          );

          container.innerHTML =
            "Could not load requests.";

          return;
        }


        const data =
          await response.json();


        if (data.length === 0) {

          container.innerHTML =
            "No song requests yet.";

          return;
        }


        /* FIND DEVICES USING MULTIPLE NAMES */

        const namesByDevice = {};

        data.forEach(request => {

          if (!request.singer_id) {
            return;
          }

          if (!namesByDevice[request.singer_id]) {

            namesByDevice[
              request.singer_id
            ] = new Set();

          }

          namesByDevice[
            request.singer_id
          ].add(
            String(request.singer_name || "")
              .trim()
              .toLowerCase()
          );

        });


        const mismatchedDevices =
          new Set(

            Object.entries(namesByDevice)

              .filter(
                ([id, names]) =>
                  names.size > 1
              )

              .map(
                ([id]) => id
              )

          );


        /* ACTIVE REQUESTS */

        const activeRequests =
          data.filter(
            request =>
              request.status !== "completed"
          );


        if (activeRequests.length === 0) {

          container.innerHTML =
            "No song requests yet.";

          return;
        }


        /* BUILD COMPACT REQUEST ROWS */

        container.innerHTML =
          activeRequests.map(request => {

            const currentName =
              String(
                request.singer_name || ""
              ).trim();

            const originalName =
              String(
                request.original_name || ""
              ).trim();

            const nameChanged =
              originalName &&
              originalName.toLowerCase() !==
              currentName.toLowerCase();

            const sameDeviceMismatch =
              request.singer_id &&
              mismatchedDevices.has(
                request.singer_id
              );

            const isUpNext =
              request.status === "up_next";


            return `

              <div class="request ${isUpNext ? "up-next" : ""}">

                <div class="singer">
                  ${escapeHtml(currentName)}
                </div>

                <div class="song">
                  ${escapeHtml(request.song_title)}
                </div>

                <div class="artist">
                  ${escapeHtml(request.artist)}
                </div>

                <div class="status">
                  ${
                    isUpNext
                      ? "UP NEXT"
                      : "WAITING"
                  }
                </div>

                <div class="time">
                  ${formatTime(request.created_at)}
                </div>

                <div class="controls">

                  <button
                    onclick="updateStatus(
                      ${request.id},
                      'up_next'
                    )"
                  >
                    Up Next
                  </button>

                  <button
                    onclick="finishRequest(
                      ${request.id}
                    )"
                  >
                    Done
                  </button>

                </div>


                ${
                  nameChanged || sameDeviceMismatch

                    ? `
                      <div class="warnings">

                        ${
                          nameChanged

                            ? `
                              <div class="warning">
                                ⚠️ Originally:
                                ${escapeHtml(originalName)}
                              </div>
                            `

                            : ""
                        }

                        ${
                          sameDeviceMismatch

                            ? `
                              <div class="warning">
                                ⚠️ NAME MISMATCH - SAME DEVICE
                              </div>
                            `

                            : ""
                        }

                      </div>
                    `

                    : ""
                }

              </div>

            `;

          }).join("");

      }

      catch (error) {

        console.error(error);

        container.innerHTML =
          "Could not load requests.";

      }

    }


    /* UP NEXT */

    async function updateStatus(
      id,
      newStatus
    ) {

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/requests?id=eq.${id}`,
        {
          method: "PATCH",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              `Bearer ${SUPABASE_KEY}`,
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            status: newStatus
          })
        }
      );


      if (!response.ok) {

        alert(
          "Could not update this request."
        );

        return;
      }


      loadRequests();

    }


    /* DONE = DELETE IMMEDIATELY */

    async function finishRequest(id) {

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/requests?id=eq.${id}`,
        {
          method: "DELETE",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              `Bearer ${SUPABASE_KEY}`
          }
        }
      );


      if (!response.ok) {

        alert(
          "Could not finish this request."
        );

        return;
      }


      loadRequests();

    }


    /* START */

    loadRequests();


    /* AUTO REFRESH EVERY 5 SECONDS */

    setInterval(
      loadRequests,
      5000
    );

  </script>

</body>

</html>

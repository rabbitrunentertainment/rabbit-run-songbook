<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rabbit Run Song Requests</title>

  <style>
    body {
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin: 0 0 2px;
    }

    .subtitle {
      text-align: center;
      color: #d8b4fe;
      margin-bottom: 14px;
      font-size: 13px;
    }

    #requests {
      max-width: 1100px;
      margin: auto;
    }

    .request {
      background: #1f2937;
      border: 2px solid #7c3aed;
      border-radius: 9px;
      padding: 8px 10px;
      margin-bottom: 6px;

      display: grid;
      grid-template-columns:
        minmax(110px, 0.8fr)
        minmax(180px, 1.6fr)
        minmax(140px, 1.3fr)
        85px
        75px
        auto;

      gap: 10px;
      align-items: center;
    }

    .request.up-next {
      border: 3px solid #d42fc5;
      background: #29203a;
    }

    .singer {
      font-size: 16px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .song {
      font-size: 15px;
      font-weight: bold;
    }

    .artist {
      color: #cbd5e1;
      font-size: 14px;
    }

    .status {
      color: #f9a8d4;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 12px;
    }

    .time {
      color: #cbd5e1;
      font-size: 12px;
    }

    .warnings {
      grid-column: 1 / -1;
    }

    .warning {
      color: #fbbf24;
      font-weight: bold;
      font-size: 12px;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    .up-next-button {
      background: #e5e7eb;
      color: #111827;
    }

    .done-button {
      background: #e5e7eb;
      color: #111827;
    }

    .current-button {
      background: #d42fc5;
      color: white;
    }

    .extra-songs {
      grid-column: 1 / -1;
      color: #d8b4fe;
      font-size: 12px;
      margin-top: 2px;
    }

    @media (max-width: 750px) {

      .request {
        display: block;
        padding: 10px;
      }

      .singer {
        font-size: 18px;
      }

      .song {
        margin-top: 4px;
      }

      .artist,
      .status,
      .time {
        margin-top: 3px;
      }

      .controls {
        justify-content: flex-start;
        margin-top: 7px;
      }

      .warnings,
      .extra-songs {
        margin-top: 4px;
      }
    }
  </style>
</head>

<body>

  <h1>🎤 Song Requests</h1>
  <div class="subtitle">Rabbit Run Entertainment</div>

  <div id="requests">
    Loading requests...
  </div>


  <script>

    const SUPABASE_URL =
      "https://cpprxqlevftbgpjjfgnz.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_HeuQI_aKycIu8i8TUBNP-A_7bHnRwp3";


    /* =========================
       SAFE DISPLAY TEXT
       ========================= */

    const escapeHtml = value =>
      String(value ?? "").replace(
        /[&<>"']/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[character])
      );


    /* =========================
       FORMAT TIME
       ========================= */

    function formatTime(timestamp) {

      return new Date(timestamp)
        .toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit"
        });

    }


    /* =========================
       SINGER IDENTITY

       Rotation uses singer name,
       NOT device ID.
       ========================= */

    function singerKey(request) {

      return String(
        request.singer_name || ""
      )
        .trim()
        .toLowerCase();

    }


    /* =========================
       FETCH ALL REQUESTS
       ========================= */

    async function fetchRequests() {

      const response = await fetch(

        `${SUPABASE_URL}/rest/v1/requests?select=*&order=created_at.asc`,

        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              `Bearer ${SUPABASE_KEY}`
          }
        }

      );


      if (!response.ok) {

        const errorText =
          await response.text();

        throw new Error(
          `Could not load requests: ${errorText}`
        );

      }


      return await response.json();

    }


    /* =========================
       FIND DEVICE NAME MISMATCHES
       ========================= */

    function findMismatchedDevices(data) {

      const namesByDevice = {};


      data.forEach(request => {

        if (!request.singer_id) {
          return;
        }


        if (
          !namesByDevice[
            request.singer_id
          ]
        ) {

          namesByDevice[
            request.singer_id
          ] = new Set();

        }


        namesByDevice[
          request.singer_id
        ].add(
          String(
            request.singer_name || ""
          )
            .trim()
            .toLowerCase()
        );

      });


      return new Set(

        Object.entries(
          namesByDevice
        )

          .filter(
            ([id, names]) =>
              names.size > 1
          )

          .map(
            ([id]) => id
          )

      );

    }


    /* =========================
       BUILD ROTATION
       ========================= */

    function buildRotation(data) {

      const active =
        data.filter(
          request =>
            request.status !== "completed"
        );


      const completed =
        data.filter(
          request =>
            request.status === "completed"
        );


      /*
        LAST COMPLETED TURN
        FOR EACH SINGER
      */

      const lastCompletedBySinger =
        new Map();


      completed.forEach(request => {

        const key =
          singerKey(request);


        if (!key) {
          return;
        }


        const completedTime =
          new Date(
            request.created_at
          ).getTime();


        const existing =
          lastCompletedBySinger.get(key);


        if (
          existing === undefined ||
          completedTime > existing
        ) {

          lastCompletedBySinger.set(
            key,
            completedTime
          );

        }

      });


      /*
        GROUP ACTIVE SONGS
        BY SINGER
      */

      const singersByName =
        new Map();


      active.forEach(request => {

        const key =
          singerKey(request);


        if (!key) {
          return;
        }


        if (
          !singersByName.has(key)
        ) {

          singersByName.set(
            key,
            {
              key: key,

              name:
                String(
                  request.singer_name || ""
                ).trim(),

              requests: [],

              firstRequestTime:
                new Date(
                  request.created_at
                ).getTime(),

              lastCompletedTime:
                lastCompletedBySinger.has(key)
                  ? lastCompletedBySinger.get(key)
                  : null
            }
          );

        }


        singersByName
          .get(key)
          .requests
          .push(request);

      });


      const singers =
        Array.from(
          singersByName.values()
        );


      /*
        SORT EACH SINGER'S SONGS
        OLDEST FIRST
      */

      singers.forEach(singer => {

        singer.requests.sort(
          (a, b) =>
            new Date(a.created_at) -
            new Date(b.created_at)
        );

      });


      /*
        FIND CURRENT UP NEXT
      */

      let upNextSinger = null;


      for (const singer of singers) {

        const upNextRequest =
          singer.requests.find(
            request =>
              request.status === "up_next"
          );


        if (upNextRequest) {

          upNextSinger = singer;
          upNextSinger.currentRequest =
            upNextRequest;

          break;

        }

      }


      /*
        EVERY OTHER SINGER'S
        CURRENT SONG IS THEIR
        OLDEST ACTIVE REQUEST
      */

      singers.forEach(singer => {

        if (
          upNextSinger &&
          singer.key ===
          upNextSinger.key
        ) {
          return;
        }


        singer.currentRequest =
          singer.requests[0];

      });


      /*
        SORT THE WAITING SINGERS

        NEW SINGERS FIRST.

        REPEAT SINGERS CYCLE
        TO THE BACK.

        AMONG REPEAT SINGERS,
        THE PERSON WHO SANG
        LONGEST AGO COMES FIRST.
      */

      let waiting =
        singers.filter(
          singer =>
            !upNextSinger ||
            singer.key !==
            upNextSinger.key
        );


      waiting.sort(
        (a, b) => {

          const aHasSung =
            a.lastCompletedTime !== null;

          const bHasSung =
            b.lastCompletedTime !== null;


          if (
            aHasSung !== bHasSung
          ) {

            return aHasSung ? 1 : -1;

          }


          if (
            !aHasSung &&
            !bHasSung
          ) {

            return (
              a.firstRequestTime -
              b.firstRequestTime
            );

          }


          return (
            a.lastCompletedTime -
            b.lastCompletedTime
          );

        }
      );


      /*
        UP NEXT ALWAYS FIRST
        ON KJ SCREEN
      */

      if (upNextSinger) {

        return [
          upNextSinger,
          ...waiting
        ];

      }


      return waiting;

    }


    /* =========================
       MAKE ONE REQUEST UP NEXT

       FIRST RESET ANY EXISTING
       UP NEXT REQUESTS TO WAITING.
       ========================= */

    async function setUpNext(id) {

      /*
        RESET CURRENT UP NEXT
      */

      const resetResponse =
        await fetch(

          `${SUPABASE_URL}/rest/v1/requests?status=eq.up_next`,

          {
            method: "PATCH",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                `Bearer ${SUPABASE_KEY}`,
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              status: "waiting"
            })
          }

        );


      if (!resetResponse.ok) {

        throw new Error(
          "Could not reset Up Next."
        );

      }


      /*
        SET SELECTED SONG
        TO UP NEXT
      */

      const response =
        await fetch(

          `${SUPABASE_URL}/rest/v1/requests?id=eq.${id}`,

          {
            method: "PATCH",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                `Bearer ${SUPABASE_KEY}`,
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              status: "up_next"
            })
          }

        );


      if (!response.ok) {

        throw new Error(
          "Could not set Up Next."
        );

      }

    }


    /* =========================
       AUTOMATICALLY CHOOSE
       UP NEXT IF NONE EXISTS
       ========================= */

    async function ensureUpNext(data) {

      const active =
        data.filter(
          request =>
            request.status !== "completed"
        );


      if (active.length === 0) {
        return false;
      }


      const existingUpNext =
        active.find(
          request =>
            request.status === "up_next"
        );


      if (existingUpNext) {
        return false;
      }


      const rotation =
        buildRotation(data);


      if (
        rotation.length === 0 ||
        !rotation[0].currentRequest
      ) {
        return false;
      }


      await setUpNext(
        rotation[0]
          .currentRequest
          .id
      );


      return true;

    }


    /* =========================
       LOAD KJ SCREEN
       ========================= */

    async function loadRequests() {

      const container =
        document.getElementById(
          "requests"
        );


      try {

        let data =
          await fetchRequests();


        /*
          IF NOBODY IS UP NEXT,
          PICK THE FIRST SINGER
          AUTOMATICALLY.
        */

        const changed =
          await ensureUpNext(data);


        if (changed) {

          data =
            await fetchRequests();

        }


        const activeRequests =
          data.filter(
            request =>
              request.status !==
              "completed"
          );


        if (
          activeRequests.length === 0
        ) {

          container.innerHTML =
            "No song requests yet.";

          return;
        }


        const mismatchedDevices =
          findMismatchedDevices(data);


        const rotation =
          buildRotation(data);


        /*
          BUILD KJ ROWS IN THE
          SAME ROTATION ORDER
        */

        container.innerHTML =
          rotation.map(singer => {

            const request =
              singer.currentRequest;


            if (!request) {
              return "";
            }


            const currentName =
              String(
                request.singer_name || ""
              ).trim();


            const originalName =
              String(
                request.original_name || ""
              ).trim();


            const nameChanged =
              originalName &&
              originalName.toLowerCase() !==
              currentName.toLowerCase();


            const sameDeviceMismatch =
              request.singer_id &&
              mismatchedDevices.has(
                request.singer_id
              );


            const isUpNext =
              request.status ===
              "up_next";


            const extraSongCount =
              singer.requests.length - 1;


            return `

              <div
                class="request
                ${isUpNext ? "up-next" : ""}"
              >

                <div class="singer">
                  ${escapeHtml(
                    currentName
                  )}
                </div>


                <div class="song">
                  ${escapeHtml(
                    request.song_title
                  )}
                </div>


                <div class="artist">
                  ${escapeHtml(
                    request.artist
                  )}
                </div>


                <div class="status">

                  ${
                    isUpNext
                      ? "UP NEXT"
                      : "WAITING"
                  }

                </div>


                <div class="time">
                  ${formatTime(
                    request.created_at
                  )}
                </div>


                <div class="controls">

                  ${
                    isUpNext

                      ? `
                        <button
                          class="current-button"
                          disabled
                        >
                          Up Next
                        </button>
                      `

                      : `
                        <button
                          class="up-next-button"
                          onclick="manualUpNext(
                            ${request.id}
                          )"
                        >
                          Up Next
                        </button>
                      `
                  }


                  <button
                    class="done-button"
                    onclick="finishRequest(
                      ${request.id}
                    )"
                  >
                    Done
                  </button>

                </div>


                ${
                  extraSongCount > 0

                    ? `
                      <div class="extra-songs">

                        + ${extraSongCount}
                        more
                        ${
                          extraSongCount === 1
                            ? "song"
                            : "songs"
                        }
                        waiting for
                        ${escapeHtml(
                          currentName
                        )}

                      </div>
                    `

                    : ""
                }


                ${
                  nameChanged ||
                  sameDeviceMismatch

                    ? `
                      <div class="warnings">

                        ${
                          nameChanged

                            ? `
                              <div class="warning">

                                ⚠️ Originally:
                                ${escapeHtml(
                                  originalName
                                )}

                              </div>
                            `

                            : ""
                        }


                        ${
                          sameDeviceMismatch

                            ? `
                              <div class="warning">

                                ⚠️ NAME MISMATCH -
                                SAME DEVICE

                              </div>
                            `

                            : ""
                        }

                      </div>
                    `

                    : ""
                }

              </div>

            `;

          }).join("");

      }


      catch (error) {

        console.error(error);

        container.innerHTML =
          "Could not load requests.";

      }

    }


    /* =========================
       MANUAL UP NEXT OVERRIDE
       ========================= */

    async function manualUpNext(id) {

      try {

        await setUpNext(id);

        await loadRequests();

      }

      catch (error) {

        console.error(error);

        alert(
          "Could not change Up Next."
        );

      }

    }


    /* =========================
       DONE

       MARK CURRENT SONG
       COMPLETED.

       THEN LOADREQUESTS()
       AUTOMATICALLY CHOOSES
       THE NEXT SINGER.
       ========================= */

    async function finishRequest(id) {

      try {

        const response =
          await fetch(

            `${SUPABASE_URL}/rest/v1/requests?id=eq.${id}`,

            {
              method: "PATCH",

              headers: {
                "apikey": SUPABASE_KEY,
                "Authorization":
                  `Bearer ${SUPABASE_KEY}`,
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                status: "completed"
              })
            }

          );


        if (!response.ok) {

          throw new Error(
            "Could not finish request."
          );

        }


        /*
          RELOAD.

          SINCE THE OLD UP NEXT
          IS NOW COMPLETED,
          LOADREQUESTS WILL
          AUTOMATICALLY SELECT
          THE NEXT SINGER.
        */

        await loadRequests();

      }


      catch (error) {

        console.error(error);

        alert(
          "Could not finish this request."
        );

      }

    }


    /* =========================
       START
       ========================= */

    loadRequests();


    /* =========================
       AUTO REFRESH
       ========================= */

    setInterval(
      loadRequests,
      5000
    );

  </script>

</body>

</html>

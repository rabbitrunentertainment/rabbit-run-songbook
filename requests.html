<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rabbit Run Song Requests</title>

  <style>
    body {
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin: 0 0 2px;
    }

    .subtitle {
      text-align: center;
      color: #d8b4fe;
      margin-bottom: 14px;
      font-size: 13px;
    }

    #requests {
      max-width: 1100px;
      margin: auto;
    }

    .section-title {
      max-width: 1100px;
      margin: 22px auto 8px;
      color: #d8b4fe;
      font-size: 18px;
      font-weight: bold;
    }

    .request {
      background: #1f2937;
      border: 2px solid #7c3aed;
      border-radius: 9px;
      padding: 8px 10px;
      margin-bottom: 6px;

      display: grid;
      grid-template-columns:
        minmax(110px, 0.8fr)
        minmax(180px, 1.6fr)
        minmax(140px, 1.3fr)
        85px
        75px
        auto;

      gap: 10px;
      align-items: center;
    }

    .request.up-next {
      border: 3px solid #d42fc5;
      background: #29203a;
    }

    .request.paused {
      border-color: #64748b;
      background: #18202d;
      opacity: .9;
    }

    .singer {
      font-size: 16px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .song {
      font-size: 15px;
      font-weight: bold;
    }

    .artist {
      color: #cbd5e1;
      font-size: 14px;
    }

    .status {
      color: #f9a8d4;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 12px;
    }

    .paused .status {
      color: #fbbf24;
    }

    .time {
      color: #cbd5e1;
      font-size: 12px;
    }

    .warnings {
      grid-column: 1 / -1;
    }

    .warning {
      color: #fbbf24;
      font-weight: bold;
      font-size: 12px;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    .up-next-button,
    .done-button {
      background: #e5e7eb;
      color: #111827;
    }

    .pause-button {
      background: #fbbf24;
      color: #111827;
    }

    .resume-button {
      background: #d8b4fe;
      color: #111827;
    }

    .current-button {
      background: #d42fc5;
      color: white;
    }

    .extra-songs {
      grid-column: 1 / -1;
      color: #d8b4fe;
      font-size: 12px;
      margin-top: 2px;
    }

    .paused-note {
      max-width: 1100px;
      margin: 0 auto 8px;
      color: #94a3b8;
      font-size: 12px;
    }

    #pausedRequests {
      max-width: 1100px;
      margin: auto;
    }

    .tv-display-control {
      max-width: 1100px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tv-display-label {
      color: #d8b4fe;
      font-size: 13px;
      font-weight: bold;
      margin-right: 2px;
    }

    .tv-count-button {
      min-width: 42px;
      background: #374151;
      color: white;
      border: 2px solid #64748b;
    }

    .tv-count-button.selected {
      background: #d42fc5;
      border-color: #f9a8d4;
      color: white;
      box-shadow: 0 0 12px rgba(212,47,197,.35);
    }

    @media (max-width: 750px) {

      .request {
        display: block;
        padding: 10px;
      }

      .singer {
        font-size: 18px;
      }

      .song {
        margin-top: 4px;
      }

      .artist,
      .status,
      .time {
        margin-top: 3px;
      }

      .controls {
        justify-content: flex-start;
        margin-top: 7px;
      }

      .warnings,
      .extra-songs {
        margin-top: 4px;
      }
    }
  </style>
</head>

<body>

  <h1>🎤 Song Requests</h1>
  <div class="subtitle">Rabbit Run Entertainment</div>

  <div class="tv-display-control">
    <span class="tv-display-label">TV SHOWS:</span>
    <button id="tvShow2" class="tv-count-button" onclick="setTvDisplayCount(2)">2</button>
    <button id="tvShow4" class="tv-count-button" onclick="setTvDisplayCount(4)">4</button>
    <button id="tvShow6" class="tv-count-button" onclick="setTvDisplayCount(6)">6</button>
  </div>

  <div id="requests">
    Loading requests...
  </div>

  <div
    id="pausedSection"
    style="display:none;"
  >

    <div class="section-title">
      ⏸ Paused Singers
    </div>

    <div class="paused-note">
      Saved for later and hidden from the active rotation.
    </div>

    <div id="pausedRequests"></div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://cpprxqlevftbgpjjfgnz.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_HeuQI_aKycIu8i8TUBNP-A_7bHnRwp3";


    /* =========================
       SHARED TV DISPLAY SETTING
       ========================= */

    const SETTINGS_SINGER =
      "__RABBIT_RUN_SETTINGS__";

    const TV_DISPLAY_SETTING =
      "TV_DISPLAY_COUNT";

    const DEFAULT_TV_DISPLAY_COUNT = 6;


    function getTvDisplayCount(data) {

      const settings =
        data
          .filter(
            request =>
              request.singer_name === SETTINGS_SINGER &&
              request.song_title === TV_DISPLAY_SETTING
          )
          .sort(
            (a, b) =>
              new Date(b.created_at) -
              new Date(a.created_at)
          );

      if (settings.length === 0) {
        return DEFAULT_TV_DISPLAY_COUNT;
      }

      const value = Number(settings[0].artist);

      return [2, 4, 6].includes(value)
        ? value
        : DEFAULT_TV_DISPLAY_COUNT;
    }


    function updateTvDisplayButtons(count) {

      [2, 4, 6].forEach(value => {

        const button =
          document.getElementById(
            `tvShow${value}`
          );

        if (!button) {
          return;
        }

        button.classList.toggle(
          "selected",
          value === count
        );

      });

    }


    async function setTvDisplayCount(count) {

      if (![2, 4, 6].includes(count)) {
        return;
      }

      try {

        const deleteResponse =
          await fetch(
            `${SUPABASE_URL}/rest/v1/requests?singer_name=eq.${encodeURIComponent(SETTINGS_SINGER)}&song_title=eq.${encodeURIComponent(TV_DISPLAY_SETTING)}`,
            {
              method: "DELETE",
              headers: {
                "apikey": SUPABASE_KEY,
                "Authorization":
                  `Bearer ${SUPABASE_KEY}`
              }
            }
          );

        if (!deleteResponse.ok) {
          throw new Error(
            "Could not clear old TV display setting."
          );
        }

        const response =
          await fetch(
            `${SUPABASE_URL}/rest/v1/requests`,
            {
              method: "POST",
              headers: {
                "apikey": SUPABASE_KEY,
                "Authorization":
                  `Bearer ${SUPABASE_KEY}`,
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                singer_name: SETTINGS_SINGER,
                song_title: TV_DISPLAY_SETTING,
                artist: String(count),
                status: "completed"
              })
            }
          );

        if (!response.ok) {
          const errorText =
            await response.text();

          throw new Error(
            `Could not save TV display setting: ${errorText}`
          );
        }

        updateTvDisplayButtons(count);

      }

      catch (error) {

        console.error(error);

        alert(
          "Could not change the TV display."
        );

      }

    }


    /* =========================
       SAFE DISPLAY TEXT
       ========================= */

    const escapeHtml = value =>
      String(value ?? "").replace(
        /[&<>"']/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[character])
      );


    /* =========================
       FORMAT TIME
       ========================= */

    function formatTime(timestamp) {

      return new Date(timestamp)
        .toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit"
        });

    }


    /* =========================
       SINGER IDENTITY
       ========================= */

    function singerKey(request) {

      if (
        request.singer_name ===
        SETTINGS_SINGER
      ) {
        return "";
      }

      return String(
        request.singer_name || ""
      )
        .trim()
        .toLowerCase();

    }


    /* =========================
       STATUS HELPERS
       ========================= */

    function isPaused(request) {

      return request.status === "paused";

    }


    function isCompleted(request) {

      return (
        request.status === "completed" &&
        request.singer_name !== SETTINGS_SINGER
      );

    }


    function isActive(request) {

      return (
        request.singer_name !== SETTINGS_SINGER &&
        !isCompleted(request) &&
        !isPaused(request)
      );

    }


    /*
      WHEN A PAUSED SINGER IS RESUMED,
      WE STORE THE RESUME TIME INSIDE
      THE STATUS.

      THIS LETS THEM GO TO THE BACK
      WITHOUT NEEDING A NEW DATABASE
      COLUMN.
    */

    function resumedTime(request) {

      const status =
        String(request.status || "");

      if (
        !status.startsWith(
          "waiting_resumed_"
        )
      ) {
        return null;
      }

      const value =
        Number(
          status.replace(
            "waiting_resumed_",
            ""
          )
        );

      return Number.isFinite(value)
        ? value
        : null;

    }


    /* =========================
       FETCH ALL REQUESTS
       ========================= */

    async function fetchRequests() {

      const response = await fetch(

        `${SUPABASE_URL}/rest/v1/requests?select=*&order=created_at.asc`,

        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              `Bearer ${SUPABASE_KEY}`
          }
        }

      );


      if (!response.ok) {

        const errorText =
          await response.text();

        throw new Error(
          `Could not load requests: ${errorText}`
        );

      }


      return await response.json();

    }


    /* =========================
       DEVICE NAME MISMATCHES
       ========================= */

    function findMismatchedDevices(data) {

      const namesByDevice = {};


      data.forEach(request => {

        if (!request.singer_id) {
          return;
        }


        if (
          !namesByDevice[
            request.singer_id
          ]
        ) {

          namesByDevice[
            request.singer_id
          ] = new Set();

        }


        namesByDevice[
          request.singer_id
        ].add(
          String(
            request.singer_name || ""
          )
            .trim()
            .toLowerCase()
        );

      });


      return new Set(

        Object.entries(
          namesByDevice
        )

          .filter(
            ([id, names]) =>
              names.size > 1
          )

          .map(
            ([id]) => id
          )

      );

    }


    /* =========================
       BUILD ACTIVE ROTATION
       ========================= */

    function buildRotation(data) {

      const active =
        data.filter(isActive);


      const completed =
        data.filter(isCompleted);


      /*
        LAST COMPLETED TURN
        FOR EACH SINGER
      */

      const lastCompletedBySinger =
        new Map();


      completed.forEach(request => {

        const key =
          singerKey(request);


        if (!key) {
          return;
        }


        const completedTime =
          new Date(
            request.created_at
          ).getTime();


        const existing =
          lastCompletedBySinger.get(key);


        if (
          existing === undefined ||
          completedTime > existing
        ) {

          lastCompletedBySinger.set(
            key,
            completedTime
          );

        }

      });


      /*
        GROUP ACTIVE SONGS
        BY SINGER
      */

      const singersByName =
        new Map();


      active.forEach(request => {

        const key =
          singerKey(request);


        if (!key) {
          return;
        }


        if (
          !singersByName.has(key)
        ) {

          singersByName.set(
            key,
            {
              key: key,

              name:
                String(
                  request.singer_name || ""
                ).trim(),

              requests: [],

              firstRequestTime:
                new Date(
                  request.created_at
                ).getTime(),

              lastCompletedTime:
                lastCompletedBySinger.has(key)
                  ? lastCompletedBySinger.get(key)
                  : null,

              resumedAt:
                null
            }
          );

        }


        const singer =
          singersByName.get(key);


        singer.requests.push(request);


        const resume =
          resumedTime(request);


        if (
          resume !== null &&
          (
            singer.resumedAt === null ||
            resume > singer.resumedAt
          )
        ) {

          singer.resumedAt =
            resume;

        }

      });


      const singers =
        Array.from(
          singersByName.values()
        );


      /*
        SORT EACH SINGER'S SONGS
        OLDEST FIRST
      */

      singers.forEach(singer => {

        singer.requests.sort(
          (a, b) =>
            new Date(a.created_at) -
            new Date(b.created_at)
        );

      });


      /*
        FIND CURRENT UP NEXT
      */

      let upNextSinger = null;


      for (const singer of singers) {

        const upNextRequest =
          singer.requests.find(
            request =>
              request.status ===
              "up_next"
          );


        if (upNextRequest) {

          upNextSinger = singer;

          upNextSinger.currentRequest =
            upNextRequest;

          break;

        }

      }


      /*
        EVERY OTHER SINGER'S
        NEXT SONG IS THEIR
        OLDEST ACTIVE SONG
      */

      singers.forEach(singer => {

        if (
          upNextSinger &&
          singer.key ===
          upNextSinger.key
        ) {
          return;
        }


        singer.currentRequest =
          singer.requests[0];

      });


      let waiting =
        singers.filter(
          singer =>
            !upNextSinger ||
            singer.key !==
            upNextSinger.key
        );


      /*
        ROTATION ORDER

        1. NEW SINGERS
        2. REPEAT SINGERS
        3. RESUMED SINGERS GO LAST
      */

      waiting.sort(
        (a, b) => {

          const aResumed =
            a.resumedAt !== null;

          const bResumed =
            b.resumedAt !== null;


          /*
            RESUMED SINGERS
            ALWAYS GO BEHIND
            CURRENT ROTATION
          */

          if (
            aResumed !== bResumed
          ) {

            return aResumed ? 1 : -1;

          }


          /*
            IF BOTH WERE RESUMED,
            EARLIER RESUME GOES FIRST
          */

          if (
            aResumed &&
            bResumed
          ) {

            return (
              a.resumedAt -
              b.resumedAt
            );

          }


          const aHasSung =
            a.lastCompletedTime !== null;

          const bHasSung =
            b.lastCompletedTime !== null;


          if (
            aHasSung !== bHasSung
          ) {

            return aHasSung ? 1 : -1;

          }


          if (
            !aHasSung &&
            !bHasSung
          ) {

            return (
              a.firstRequestTime -
              b.firstRequestTime
            );

          }


          return (
            a.lastCompletedTime -
            b.lastCompletedTime
          );

        }
      );


      if (upNextSinger) {

        return [
          upNextSinger,
          ...waiting
        ];

      }


      return waiting;

    }


    /* =========================
       SET ONE REQUEST UP NEXT
       ========================= */

    async function setUpNext(id) {

      /*
        RESET CURRENT UP NEXT
      */

      const resetResponse =
        await fetch(

          `${SUPABASE_URL}/rest/v1/requests?status=eq.up_next`,

          {
            method: "PATCH",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                `Bearer ${SUPABASE_KEY}`,
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              status: "waiting"
            })
          }

        );


      if (!resetResponse.ok) {

        throw new Error(
          "Could not reset Up Next."
        );

      }


      /*
        SET SELECTED SONG
        UP NEXT
      */

      const response =
        await fetch(

          `${SUPABASE_URL}/rest/v1/requests?id=eq.${id}`,

          {
            method: "PATCH",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                `Bearer ${SUPABASE_KEY}`,
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              status: "up_next"
            })
          }

        );


      if (!response.ok) {

        throw new Error(
          "Could not set Up Next."
        );

      }

    }


    /* =========================
       AUTOMATIC UP NEXT
       ========================= */

    async function ensureUpNext(data) {

      const active =
        data.filter(isActive);


      if (active.length === 0) {
        return false;
      }


      const existingUpNext =
        active.find(
          request =>
            request.status ===
            "up_next"
        );


      if (existingUpNext) {
        return false;
      }


      const rotation =
        buildRotation(data);


      if (
        rotation.length === 0 ||
        !rotation[0].currentRequest
      ) {
        return false;
      }


      await setUpNext(
        rotation[0]
          .currentRequest
          .id
      );


      return true;

    }


    /* =========================
       PAUSED SINGERS
       ========================= */

    function buildPausedSingers(data) {

      const paused =
        data.filter(isPaused);


      const singers =
        new Map();


      paused.forEach(request => {

        const key =
          singerKey(request);


        if (!key) {
          return;
        }


        if (!singers.has(key)) {

          singers.set(
            key,
            {
              key: key,

              name:
                String(
                  request.singer_name || ""
                ).trim(),

              requests: []
            }
          );

        }


        singers
          .get(key)
          .requests
          .push(request);

      });


      const result =
        Array.from(
          singers.values()
        );


      result.forEach(singer => {

        singer.requests.sort(
          (a, b) =>
            new Date(a.created_at) -
            new Date(b.created_at)
        );

      });


      return result;

    }


    /* =========================
       LOAD KJ SCREEN
       ========================= */

    async function loadRequests() {

      const container =
        document.getElementById(
          "requests"
        );

      const pausedSection =
        document.getElementById(
          "pausedSection"
        );

      const pausedContainer =
        document.getElementById(
          "pausedRequests"
        );


      try {

        let data =
          await fetchRequests();


        /*
          SHOW CURRENT TV DISPLAY
          SETTING ON THE KJ PAGE
        */

        updateTvDisplayButtons(
          getTvDisplayCount(data)
        );


        /*
          AUTO PICK UP NEXT
        */

        const changed =
          await ensureUpNext(data);


        if (changed) {

          data =
            await fetchRequests();

        }


        const mismatchedDevices =
          findMismatchedDevices(data);


        const rotation =
          buildRotation(data);


        /*
          ACTIVE ROTATION
        */

        if (rotation.length === 0) {

          container.innerHTML =
            "No active singers right now.";

        }

        else {

          container.innerHTML =
            rotation.map(singer => {

              const request =
                singer.currentRequest;


              if (!request) {
                return "";
              }


              const currentName =
                String(
                  request.singer_name || ""
                ).trim();


              const originalName =
                String(
                  request.original_name || ""
                ).trim();


              const nameChanged =
                originalName &&
                originalName.toLowerCase() !==
                currentName.toLowerCase();


              const sameDeviceMismatch =
                request.singer_id &&
                mismatchedDevices.has(
                  request.singer_id
                );


              const isUpNext =
                request.status ===
                "up_next";


              const extraSongCount =
                singer.requests.length - 1;


              return `

                <div
                  class="request
                  ${isUpNext ? "up-next" : ""}"
                >

                  <div class="singer">
                    ${escapeHtml(
                      currentName
                    )}
                  </div>


                  <div class="song">
                    ${escapeHtml(
                      request.song_title
                    )}
                  </div>


                  <div class="artist">
                    ${escapeHtml(
                      request.artist
                    )}
                  </div>


                  <div class="status">

                    ${
                      isUpNext
                        ? "UP NEXT"
                        : "WAITING"
                    }

                  </div>


                  <div class="time">
                    ${formatTime(
                      request.created_at
                    )}
                  </div>


                  <div class="controls">

                    ${
                      isUpNext

                        ? `
                          <button
                            class="current-button"
                            disabled
                          >
                            Up Next
                          </button>
                        `

                        : `
                          <button
                            class="up-next-button"
                            onclick="manualUpNext(
                              ${request.id}
                            )"
                          >
                            Up Next
                          </button>
                        `
                    }


                    <button
                      class="pause-button"
                      onclick='pauseSinger(
                        ${JSON.stringify(
                          singer.key
                        )}
                      )'
                    >
                      Pause
                    </button>


                    <button
                      class="done-button"
                      onclick="finishRequest(
                        ${request.id}
                      )"
                    >
                      Done
                    </button>

                  </div>


                  ${
                    extraSongCount > 0

                      ? `
                        <div class="extra-songs">

                          + ${extraSongCount}
                          more
                          ${
                            extraSongCount === 1
                              ? "song"
                              : "songs"
                          }
                          waiting for
                          ${escapeHtml(
                            currentName
                          )}

                        </div>
                      `

                      : ""
                  }


                  ${
                    nameChanged ||
                    sameDeviceMismatch

                      ? `
                        <div class="warnings">

                          ${
                            nameChanged

                              ? `
                                <div class="warning">

                                  ⚠️ Originally:
                                  ${escapeHtml(
                                    originalName
                                  )}

                                </div>
                              `

                              : ""
                          }


                          ${
                            sameDeviceMismatch

                              ? `
                                <div class="warning">

                                  ⚠️ NAME MISMATCH -
                                  SAME DEVICE

                                </div>
                              `

                              : ""
                          }

                        </div>
                      `

                      : ""
                  }

                </div>

              `;

            }).join("");

        }


        /*
          PAUSED SECTION
        */

        const pausedSingers =
          buildPausedSingers(data);


        if (
          pausedSingers.length === 0
        ) {

          pausedSection.style.display =
            "none";

          pausedContainer.innerHTML =
            "";

        }

        else {

          pausedSection.style.display =
            "block";


          pausedContainer.innerHTML =
            pausedSingers.map(singer => {

              const request =
                singer.requests[0];


              const songCount =
                singer.requests.length;


              return `

                <div class="request paused">

                  <div class="singer">
                    ${escapeHtml(
                      singer.name
                    )}
                  </div>


                  <div class="song">
                    ${escapeHtml(
                      request.song_title
                    )}
                  </div>


                  <div class="artist">
                    ${escapeHtml(
                      request.artist
                    )}
                  </div>


                  <div class="status">
                    PAUSED
                  </div>


                  <div class="time">
                    ${songCount}
                    ${
                      songCount === 1
                        ? "song"
                        : "songs"
                    }
                  </div>


                  <div class="controls">

                    <button
                      class="resume-button"
                      onclick='resumeSinger(
                        ${JSON.stringify(
                          singer.key
                        )}
                      )'
                    >
                      Resume
                    </button>

                  </div>


                  ${
                    songCount > 1

                      ? `
                        <div class="extra-songs">

                          + ${songCount - 1}
                          more
                          ${
                            songCount - 1 === 1
                              ? "song"
                              : "songs"
                          }
                          saved for later

                        </div>
                      `

                      : ""
                  }

                </div>

              `;

            }).join("");

        }

      }


      catch (error) {

        console.error(error);

        container.innerHTML =
          "Could not load requests.";

      }

    }


    /* =========================
       MANUAL UP NEXT
       ========================= */

    async function manualUpNext(id) {

      try {

        await setUpNext(id);

        await loadRequests();

      }

      catch (error) {

        console.error(error);

        alert(
          "Could not change Up Next."
        );

      }

    }


    /* =========================
       PAUSE SINGER

       PAUSES ALL REMAINING
       REQUESTS FOR THAT SINGER.
       ========================= */

    async function pauseSinger(key) {

      try {

        const data =
          await fetchRequests();


        const singerRequests =
          data.filter(
            request =>
              isActive(request) &&
              singerKey(request) === key
          );


        if (
          singerRequests.length === 0
        ) {
          return;
        }


        for (
          const request of singerRequests
        ) {

          const response =
            await fetch(

              `${SUPABASE_URL}/rest/v1/requests?id=eq.${request.id}`,

              {
                method: "PATCH",

                headers: {
                  "apikey":
                    SUPABASE_KEY,

                  "Authorization":
                    `Bearer ${SUPABASE_KEY}`,

                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  status: "paused"
                })
              }

            );


          if (!response.ok) {

            throw new Error(
              "Could not pause singer."
            );

          }

        }


        /*
          IF THEY WERE UP NEXT,
          LOADREQUESTS WILL
          AUTOMATICALLY ADVANCE.
        */

        await loadRequests();

      }


      catch (error) {

        console.error(error);

        alert(
          "Could not pause this singer."
        );

      }

    }


    /* =========================
       RESUME SINGER

       RESTORES ALL THEIR SONGS
       AND PUTS THEM AT THE BACK.
       ========================= */

    async function resumeSinger(key) {

      try {

        const data =
          await fetchRequests();


        const singerRequests =
          data.filter(
            request =>
              isPaused(request) &&
              singerKey(request) === key
          );


        if (
          singerRequests.length === 0
        ) {
          return;
        }


        const resumeStatus =
          `waiting_resumed_${Date.now()}`;


        for (
          const request of singerRequests
        ) {

          const response =
            await fetch(

              `${SUPABASE_URL}/rest/v1/requests?id=eq.${request.id}`,

              {
                method: "PATCH",

                headers: {
                  "apikey":
                    SUPABASE_KEY,

                  "Authorization":
                    `Bearer ${SUPABASE_KEY}`,

                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  status: resumeStatus
                })
              }

            );


          if (!response.ok) {

            throw new Error(
              "Could not resume singer."
            );

          }

        }


        await loadRequests();

      }


      catch (error) {

        console.error(error);

        alert(
          "Could not resume this singer."
        );

      }

    }


    /* =========================
       DONE
       ========================= */

    async function finishRequest(id) {

      try {

        const response =
          await fetch(

            `${SUPABASE_URL}/rest/v1/requests?id=eq.${id}`,

            {
              method: "PATCH",

              headers: {
                "apikey": SUPABASE_KEY,
                "Authorization":
                  `Bearer ${SUPABASE_KEY}`,
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                status: "completed"
              })
            }

          );


        if (!response.ok) {

          throw new Error(
            "Could not finish request."
          );

        }


        /*
          AUTOMATICALLY ADVANCE
          TO NEXT AVAILABLE SINGER
        */

        await loadRequests();

      }


      catch (error) {

        console.error(error);

        alert(
          "Could not finish this request."
        );

      }

    }


    /* =========================
       START
       ========================= */

    loadRequests();


    /* =========================
       AUTO REFRESH
       ========================= */

    setInterval(
      loadRequests,
      5000
    );

  </script>

</body>

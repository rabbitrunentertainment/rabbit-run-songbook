<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rabbit Run Karaoke Rotation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, #32104b 0, transparent 35%),
        radial-gradient(circle at 85% 10%, #09285c 0, transparent 38%),
        #050711;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      width: min(1200px, 94vw);
      margin: auto;
      padding: 20px 20px 35px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      width: min(250px, 40vw);
      max-height: 150px;
      object-fit: contain;
      margin-bottom: 5px;
      filter: drop-shadow(0 0 18px rgba(166,66,255,.3));
    }

    h1 {
      font-size: clamp(32px, 4vw, 54px);
      margin: 0;
    }

    .subtitle {
      color: #d8b4fe;
      font-size: clamp(15px, 2vw, 20px);
      margin-top: 4px;
    }

    .up-next-box {
      border: 3px solid #d42fc5;
      background: rgba(212, 47, 197, 0.12);
      border-radius: 18px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 0 24px rgba(212, 47, 197, 0.18);
    }

    .up-next-label {
      color: #f9a8d4;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.12em;
    }

    .up-next-name {
      font-size: clamp(34px, 5vw, 62px);
      font-weight: bold;
      margin-top: 4px;
    }

    .rotation-title {
      text-align: center;
      font-size: 24px;
      margin-bottom: 12px;
      color: #d8b4fe;
      font-weight: bold;
    }

    #rotation {
      display: grid;
      gap: 8px;
    }

    .rotation-row {
      display: grid;
      grid-template-columns: 65px 1fr;
      align-items: center;
      background: rgba(31, 41, 55, 0.92);
      border: 2px solid #7c3aed;
      border-radius: 12px;
      padding: 10px 16px;
    }

    .position {
      color: #d8b4fe;
      font-size: 20px;
      font-weight: bold;
    }

    .name {
      font-size: clamp(21px, 2.5vw, 31px);
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #b9b8c7;
      font-size: 22px;
      padding: 35px 20px;
    }

    .qr-section {
      margin: 22px auto 0;
      text-align: center;
    }

    .qr-title {
      font-size: clamp(20px, 2.5vw, 28px);
      font-weight: bold;
      margin-bottom: 8px;
    }

    .qr-subtitle {
      color: #d8b4fe;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .qr {
      width: min(180px, 30vw);
      height: auto;
      background: white;
      padding: 6px;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      color: #b9b8c7;
      margin-top: 14px;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      .wrap {
        padding: 15px 12px 30px;
      }

      .logo {
        width: min(220px, 65vw);
      }

      .rotation-row {
        grid-template-columns: 42px 1fr;
        padding: 10px 12px;
      }

      .position {
        font-size: 17px;
      }

      .qr {
        width: min(170px, 48vw);
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <header>

      <img
        class="logo"
        src="Rabbit Run logo with effects-clear bkgd.png"
        alt="Rabbit Run Entertainment"
      >

      <h1>🎤 Karaoke Rotation</h1>

      <div class="subtitle">
        Rabbit Run Entertainment
      </div>

    </header>


    <div
      id="upNextBox"
      class="up-next-box"
      style="display:none;"
    >

      <div class="up-next-label">
        UP NEXT
      </div>

      <div
        id="upNextName"
        class="up-next-name"
      ></div>

    </div>


    <div class="rotation-title">
      Upcoming Singers
    </div>


    <div id="rotation">

      <div class="empty">
        Loading rotation...
      </div>

    </div>


    <div class="qr-section">

      <div class="qr-title">
        Want to Sing? 🎤
      </div>

      <div class="qr-subtitle">
        Scan to Search & Request Songs
      </div>

      <img
        class="qr"
        src="Rabbit_Run_Songbook_QR_with_Logo (1).png"
        alt="Scan to open the Rabbit Run Karaoke Song Book"
      >

    </div>


    <footer>
      Keepin' the Party Hoppin'
    </footer>

  </div>


  <script>

    const SUPABASE_URL =
      "https://cpprxqlevftbgpjjfgnz.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_HeuQI_aKycIu8i8TUBNP-A_7bHnRwp3";


    const escapeHtml = value =>
      String(value ?? "").replace(
        /[&<>"']/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[character])
      );


    async function loadRotation() {

      const rotation =
        document.getElementById("rotation");

      const upNextBox =
        document.getElementById("upNextBox");

      const upNextName =
        document.getElementById("upNextName");


      try {

        const response = await fetch(

          `${SUPABASE_URL}/rest/v1/requests?select=*&order=created_at.asc`,

          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                `Bearer ${SUPABASE_KEY}`
            }
          }

        );


        if (!response.ok) {

          rotation.innerHTML =
            `<div class="empty">
              Could not load rotation.
            </div>`;

          return;
        }


        const data =
          await response.json();


        const active =
          data.filter(request =>
            request.status !== "completed"
          );


        if (active.length === 0) {

          upNextBox.style.display =
            "none";

          rotation.innerHTML =
            `<div class="empty">
              No singers in the rotation yet.
            </div>`;

          return;
        }


        const upNextRequest =
          active.find(request =>
            request.status === "up_next"
          );


        if (upNextRequest) {

          upNextName.textContent =
            upNextRequest.singer_name;

          upNextBox.style.display =
            "block";

        }

        else {

          upNextBox.style.display =
            "none";

        }


        const singers = [];
        const seenSingers = new Set();


        active.forEach(request => {

          if (
            upNextRequest &&
            request.id === upNextRequest.id
          ) {
            return;
          }


          const singerKey =
            request.singer_id

              ? `device:${request.singer_id}`

              : `name:${String(
                  request.singer_name || ""
                )
                  .trim()
                  .toLowerCase()}`;


          if (seenSingers.has(singerKey)) {
            return;
          }


          seenSingers.add(singerKey);


          singers.push({

            name:
              String(
                request.singer_name || ""
              ).trim(),

            created_at:
              request.created_at

          });

        });


        if (singers.length === 0) {

          rotation.innerHTML =
            `<div class="empty">
              No other singers waiting.
            </div>`;

          return;
        }


        rotation.innerHTML =
          singers.map(
            (singer, index) => `

              <div class="rotation-row">

                <div class="position">
                  ${index + 1}.
                </div>

                <div class="name">
                  ${escapeHtml(singer.name)}
                </div>

              </div>

            `
          ).join("");

      }

      catch (error) {

        console.error(error);

        rotation.innerHTML =
          `<div class="empty">
            Could not load rotation.
          </div>`;

      }

    }


    loadRotation();


    setInterval(
      loadRotation,
      5000
    );

  </script>

</body>

</html>

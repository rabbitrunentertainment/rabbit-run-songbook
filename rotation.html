<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rabbit Run Karaoke Rotation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, #32104b 0, transparent 35%),
        radial-gradient(circle at 85% 10%, #09285c 0, transparent 38%),
        #050711;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      width: min(1400px, 96vw);
      margin: auto;
      padding: 14px 20px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo {
      width: min(260px, 34vw);
      max-height: 130px;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(166,66,255,.3));
    }

    h1 {
      font-size: clamp(30px, 3.8vw, 50px);
      margin: 0;
      line-height: 1;
    }

    .up-next-box {
      border: 3px solid #d42fc5;
      background: rgba(212,47,197,.13);
      border-radius: 14px;
      padding: 10px 18px;
      text-align: center;
      margin: 12px auto;
      box-shadow: 0 0 22px rgba(212,47,197,.2);
    }

    .up-next-label {
      color: #f9a8d4;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: .15em;
    }

    .up-next-name {
      font-size: clamp(34px, 5vw, 60px);
      font-weight: bold;
      line-height: 1.05;
      margin-top: 2px;
    }

    .rotation-title {
      text-align: center;
      color: #d8b4fe;
      font-size: 21px;
      font-weight: bold;
      margin: 10px 0 8px;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 18px;
      align-items: end;
    }

    #rotation {
      display: grid;
      gap: 7px;
      align-self: start;
    }

    .rotation-row {
      display: grid;
      grid-template-columns: 55px 1fr;
      align-items: center;
      background: rgba(31,41,55,.92);
      border: 2px solid #7c3aed;
      border-radius: 10px;
      padding: 10px 14px;
      min-height: 52px;
    }

    .position {
      color: #d8b4fe;
      font-size: 20px;
      font-weight: bold;
    }

    .name {
      font-size: clamp(21px, 2.5vw, 31px);
      font-weight: bold;
    }

    .more-waiting {
      text-align: center;
      color: #d8b4fe;
      font-size: 17px;
      font-weight: bold;
      padding: 6px 0 2px;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
    }

    .empty-main {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: bold;
      margin-bottom: 8px;
    }

    .empty-need {
      color: #f9a8d4;
      font-size: clamp(24px, 3vw, 34px);
      font-weight: bold;
      margin-bottom: 8px;
    }

    .empty-sub {
      color: #d8b4fe;
      font-size: clamp(16px, 2vw, 22px);
    }

    .need-more {
      text-align: center;
      padding: 30px 20px;
      background: rgba(31,41,55,.45);
      border: 2px dashed #7c3aed;
      border-radius: 12px;
    }

    .need-more-main {
      font-size: clamp(24px, 3vw, 36px);
      font-weight: bold;
      color: #f9a8d4;
      margin-bottom: 8px;
    }

    .need-more-sub {
      color: #d8b4fe;
      font-size: clamp(16px, 2vw, 21px);
    }

    .qr-section {
      text-align: center;
      align-self: end;
      padding-bottom: 4px;
    }

    .qr-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .qr-subtitle {
      color: #d8b4fe;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .qr {
      width: 180px;
      max-width: 100%;
      height: auto;
      background: white;
      padding: 5px;
      border-radius: 9px;
    }

    footer {
      text-align: center;
      color: #b9b8c7;
      margin-top: 10px;
      font-size: 13px;
    }

    @media (max-width: 700px) {

      .content {
        grid-template-columns: 1fr;
      }

      .qr-section {
        margin-top: 15px;
      }

      .qr {
        width: 160px;
      }

      .rotation-row {
        grid-template-columns: 42px 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <header>

      <img
        class="logo"
        src="Rabbit Run logo with effects-clear bkgd.png"
        alt="Rabbit Run Entertainment"
      >

      <h1>🎤 Karaoke Rotation</h1>

    </header>


    <div
      id="upNextBox"
      class="up-next-box"
      style="display:none;"
    >

      <div class="up-next-label">
        UP NEXT
      </div>

      <div
        id="upNextName"
        class="up-next-name"
      ></div>

    </div>


    <div
      id="rotationTitle"
      class="rotation-title"
    >
      Upcoming Singers
    </div>


    <div class="content">

      <div id="rotation">

        <div class="empty">
          Loading rotation...
        </div>

      </div>


      <div class="qr-section">

        <div class="qr-title">
          Want to Sing? 🎤
        </div>

        <div class="qr-subtitle">
          Scan to Search & Request Songs
        </div>

        <img
          class="qr"
          src="Rabbit_Run_Songbook_QR_with_Logo (1).png"
          alt="Scan to open the Rabbit Run Karaoke Song Book"
        >

      </div>

    </div>


    <footer>
      Keepin' the Party Hoppin'
    </footer>

  </div>


  <script>

    const SUPABASE_URL =
      "https://cpprxqlevftbgpjjfgnz.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_HeuQI_aKycIu8i8TUBNP-A_7bHnRwp3";

    const MAX_VISIBLE_SINGERS = 6;


    /* SAFE DISPLAY TEXT */

    const escapeHtml = value =>
      String(value ?? "").replace(
        /[&<>"']/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[character])
      );


    /* ROTATION USES SINGER NAME */

    function singerKey(request) {

      return String(
        request.singer_name || ""
      )
        .trim()
        .toLowerCase();

    }


    async function loadRotation() {

      const rotation =
        document.getElementById("rotation");

      const rotationTitle =
        document.getElementById("rotationTitle");

      const upNextBox =
        document.getElementById("upNextBox");

      const upNextName =
        document.getElementById("upNextName");


      try {

        const response = await fetch(

          `${SUPABASE_URL}/rest/v1/requests?select=*&order=created_at.asc`,

          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                `Bearer ${SUPABASE_KEY}`
            }
          }

        );


        if (!response.ok) {

          rotation.innerHTML =
            `<div class="empty">
              Could not load rotation.
            </div>`;

          return;
        }


        const data =
          await response.json();


        /* ACTIVE REQUESTS */

        const active =
          data.filter(request =>
            request.status !== "completed"
          );


        /* ABSOLUTELY NOBODY IN ROTATION */

        if (active.length === 0) {

          upNextBox.style.display =
            "none";

          rotationTitle.style.display =
            "none";

          rotation.innerHTML = `

            <div class="empty">

              <div class="empty-main">
                🐇 Don't leave the mic hangin'!
              </div>

              <div class="empty-need">
                We need singers!
              </div>

              <div class="empty-sub">
                Scan the QR code and hop into the rotation.
              </div>

            </div>

          `;

          return;
        }


        /* FIND UP NEXT */

        const upNextRequest =
          active.find(request =>
            request.status === "up_next"
          );


        if (upNextRequest) {

          upNextName.textContent =
            upNextRequest.singer_name;

          upNextBox.style.display =
            "block";

        }

        else {

          upNextBox.style.display =
            "none";

        }


        /* FIND EACH SINGER'S MOST RECENT COMPLETED TURN */

        const lastCompletedBySinger =
          new Map();


        data.forEach(request => {

          if (
            request.status !== "completed"
          ) {
            return;
          }


          const key =
            singerKey(request);


          if (!key) {
            return;
          }


          const completedTime =
            new Date(
              request.created_at
            ).getTime();


          const existing =
            lastCompletedBySinger.get(key);


          if (
            existing === undefined ||
            completedTime > existing
          ) {

            lastCompletedBySinger.set(
              key,
              completedTime
            );

          }

        });


        /* ONE ENTRY PER ACTIVE SINGER */

        const singersByName =
          new Map();


        active.forEach(request => {

          const key =
            singerKey(request);


          if (!key) {
            return;
          }


          if (
            !singersByName.has(key)
          ) {

            singersByName.set(
              key,
              {
                key: key,

                name:
                  String(
                    request.singer_name || ""
                  ).trim(),

                firstRequestTime:
                  new Date(
                    request.created_at
                  ).getTime(),

                lastCompletedTime:
                  lastCompletedBySinger.has(key)
                    ? lastCompletedBySinger.get(key)
                    : null
              }
            );

          }

        });


        let singers =
          Array.from(
            singersByName.values()
          );


        /* REMOVE UP NEXT FROM UPCOMING LIST */

        if (upNextRequest) {

          const upNextKey =
            singerKey(
              upNextRequest
            );


          singers =
            singers.filter(
              singer =>
                singer.key !== upNextKey
            );

        }


        /* SORT ROTATION */

        singers.sort(
          (a, b) => {

            const aHasSung =
              a.lastCompletedTime !== null;

            const bHasSung =
              b.lastCompletedTime !== null;


            if (
              aHasSung !== bHasSung
            ) {

              return aHasSung ? 1 : -1;

            }


            if (
              !aHasSung &&
              !bHasSung
            ) {

              return (
                a.firstRequestTime -
                b.firstRequestTime
              );

            }


            return (
              a.lastCompletedTime -
              b.lastCompletedTime
            );

          }
        );


        /*
          SOMEONE IS UP NEXT
          BUT NOBODY IS WAITING AFTER THEM
        */

        if (
          upNextRequest &&
          singers.length === 0
        ) {

          rotationTitle.textContent =
            "Upcoming Singers";

          rotationTitle.style.display =
            "block";

          rotation.innerHTML = `

            <div class="need-more">

              <div class="need-more-main">
                🐇 Don't leave the mic hangin'!
                We need more singers!
              </div>

              <div class="need-more-sub">
                Scan the QR code and hop into the rotation.
              </div>

            </div>

          `;

          return;
        }


        /*
          NO UP NEXT SELECTED,
          BUT THERE ARE SINGERS WAITING
        */

        rotationTitle.textContent =
          "Upcoming Singers";

        rotationTitle.style.display =
          "block";


        /* SHOW FIRST SIX */

        const visibleSingers =
          singers.slice(
            0,
            MAX_VISIBLE_SINGERS
          );


        const hiddenCount =
          singers.length -
          visibleSingers.length;


        rotation.innerHTML =

          visibleSingers.map(
            (singer, index) => `

              <div class="rotation-row">

                <div class="position">
                  ${index + 1}.
                </div>

                <div class="name">
                  ${escapeHtml(
                    singer.name
                  )}
                </div>

              </div>

            `
          ).join("")

          +

          (
            hiddenCount > 0

              ? `
                <div class="more-waiting">
                  + ${hiddenCount}
                  more
                  ${
                    hiddenCount === 1
                      ? "singer"
                      : "singers"
                  }
                  waiting 🎤
                </div>
              `

              : ""
          );

      }


      catch (error) {

        console.error(error);

        rotation.innerHTML =
          `<div class="empty">
            Could not load rotation.
          </div>`;

      }

    }


    /* START */

    loadRotation();


    /* REFRESH EVERY 5 SECONDS */

    setInterval(
      loadRotation,
      5000
    );

  </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rabbit Run Karaoke Rotation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, #32104b 0, transparent 35%),
        radial-gradient(circle at 85% 10%, #09285c 0, transparent 38%),
        #050711;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      width: min(1400px, 96vw);
      margin: auto;
      padding: 14px 20px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo {
      width: min(220px, 30vw);
      max-height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(166,66,255,.3));
    }

    h1 {
      font-size: clamp(30px, 3.8vw, 50px);
      margin: 0;
      line-height: 1;
    }

    .up-next-box {
      border: 3px solid #d42fc5;
      background: rgba(212,47,197,.13);
      border-radius: 14px;
      padding: 10px 18px;
      text-align: center;
      margin: 12px auto;
      box-shadow: 0 0 22px rgba(212,47,197,.2);
    }

    .up-next-label {
      color: #f9a8d4;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: .15em;
    }

    .up-next-name {
      font-size: clamp(34px, 5vw, 60px);
      font-weight: bold;
      line-height: 1.05;
      margin-top: 2px;
    }

    .rotation-title {
      text-align: center;
      color: #d8b4fe;
      font-size: 21px;
      font-weight: bold;
      margin: 10px 0 8px;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 18px;
      align-items: end;
    }

    #rotation {
      display: grid;
      gap: 6px;
      align-self: start;
    }

    .rotation-row {
      display: grid;
      grid-template-columns: 55px 1fr;
      align-items: center;
      background: rgba(31,41,55,.92);
      border: 2px solid #7c3aed;
      border-radius: 10px;
      padding: 8px 14px;
      min-height: 48px;
    }

    .position {
      color: #d8b4fe;
      font-size: 19px;
      font-weight: bold;
    }

    .name {
      font-size: clamp(20px, 2.4vw, 30px);
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #b9b8c7;
      font-size: 22px;
      padding: 35px 20px;
    }

    .qr-section {
      text-align: center;
      align-self: end;
      padding-bottom: 4px;
    }

    .qr-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .qr-subtitle {
      color: #d8b4fe;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .qr {
      width: 180px;
      max-width: 100%;
      height: auto;
      background: white;
      padding: 5px;
      border-radius: 9px;
    }

    footer {
      text-align: center;
      color: #b9b8c7;
      margin-top: 10px;
      font-size: 13px;
    }

    @media (max-width: 700px) {

      .content {
        grid-template-columns: 1fr;
      }

      .qr-section {
        margin-top: 15px;
      }

      .qr {
        width: 160px;
      }

      .rotation-row {
        grid-template-columns: 42px 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <header>

      <img
        class="logo"
        src="Rabbit Run logo with effects-clear bkgd.png"
        alt="Rabbit Run Entertainment"
      >

      <h1>🎤 Karaoke Rotation</h1>

    </header>


    <div
      id="upNextBox"
      class="up-next-box"
      style="display:none;"
    >

      <div class="up-next-label">
        UP NEXT
      </div>

      <div
        id="upNextName"
        class="up-next-name"
      ></div>

    </div>


    <div class="rotation-title">
      Upcoming Singers
    </div>


    <div class="content">

      <div id="rotation">

        <div class="empty">
          Loading rotation...
        </div>

      </div>


      <div class="qr-section">

        <div class="qr-title">
          Want to Sing? 🎤
        </div>

        <div class="qr-subtitle">
          Scan to Search & Request Songs
        </div>

        <img
          class="qr"
          src="Rabbit_Run_Songbook_QR_with_Logo (1).png"
          alt="Scan to open the Rabbit Run Karaoke Song Book"
        >

      </div>

    </div>


    <footer>
      Keepin' the Party Hoppin'
    </footer>

  </div>


  <script>

    const SUPABASE_URL =
      "https://cpprxqlevftbgpjjfgnz.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_HeuQI_aKycIu8i8TUBNP-A_7bHnRwp3";


    const escapeHtml = value =>
      String(value ?? "").replace(
        /[&<>"']/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[character])
      );


    function singerKey(request) {

      if (request.singer_id) {
        return `device:${request.singer_id}`;
      }

      return `name:${String(
        request.singer_name || ""
      ).trim().toLowerCase()}`;

    }


    async function loadRotation() {

      const rotation =
        document.getElementById("rotation");

      const upNextBox =
        document.getElementById("upNextBox");

      const upNextName =
        document.getElementById("upNextName");


      try {

        const response = await fetch(

          `${SUPABASE_URL}/rest/v1/requests?select=*&order=created_at.asc`,

          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                `Bearer ${SUPABASE_KEY}`
            }
          }

        );


        if (!response.ok) {

          rotation.innerHTML =
            `<div class="empty">
              Could not load rotation.
            </div>`;

          return;
        }


        const data =
          await response.json();


        /*
          ACTIVE SONG REQUESTS
        */

        const active =
          data.filter(request =>
            request.status !== "completed"
          );


        if (active.length === 0) {

          upNextBox.style.display =
            "none";

          rotation.innerHTML =
            `<div class="empty">
              No singers in the rotation yet.
            </div>`;

          return;
        }


        /*
          FIND UP NEXT
        */

        const upNextRequest =
          active.find(request =>
            request.status === "up_next"
          );


        if (upNextRequest) {

          upNextName.textContent =
            upNextRequest.singer_name;

          upNextBox.style.display =
            "block";

        }

        else {

          upNextBox.style.display =
            "none";

        }


        /*
          FIND EACH SINGER'S MOST RECENT
          COMPLETED TURN

          A singer who has already sung
          receives a later rotation position
          than singers who have not yet sung.
        */

        const lastCompletedBySinger =
          new Map();


        data.forEach(request => {

          if (
            request.status !== "completed"
          ) {
            return;
          }


          const key =
            singerKey(request);


          const completedTime =
            new Date(
              request.created_at
            ).getTime();


          const existing =
            lastCompletedBySinger.get(key);


          if (
            existing === undefined ||
            completedTime > existing
          ) {

            lastCompletedBySinger.set(
              key,
              completedTime
            );

          }

        });


        /*
          BUILD ONE ROTATION ENTRY
          PER ACTIVE SINGER
        */

        const singersByKey =
          new Map();


        active.forEach(request => {

          const key =
            singerKey(request);


          if (
            !singersByKey.has(key)
          ) {

            singersByKey.set(
              key,
              {
                key: key,

                name:
                  String(
                    request.singer_name || ""
                  ).trim(),

                firstRequestTime:
                  new Date(
                    request.created_at
                  ).getTime(),

                lastCompletedTime:
                  lastCompletedBySinger.has(key)
                    ? lastCompletedBySinger.get(key)
                    : null
              }
            );

          }

        });


        let singers =
          Array.from(
            singersByKey.values()
          );


        /*
          REMOVE UP NEXT SINGER
          FROM UPCOMING LIST
        */

        if (upNextRequest) {

          const upNextKey =
            singerKey(
              upNextRequest
            );


          singers =
            singers.filter(
              singer =>
                singer.key !== upNextKey
            );

        }


        /*
          SORT ROTATION

          1. Singers who have NOT sung yet
             stay ahead, ordered by their
             first request.

          2. Singers who HAVE sung cycle
             behind them, ordered by their
             most recent completed turn.
        */

        singers.sort(
          (a, b) => {

            const aHasSung =
              a.lastCompletedTime !== null;

            const bHasSung =
              b.lastCompletedTime !== null;


            if (
              aHasSung !== bHasSung
            ) {

              return aHasSung ? 1 : -1;

            }


            if (
              !aHasSung &&
              !bHasSung
            ) {

              return (
                a.firstRequestTime -
                b.firstRequestTime
              );

            }


            return (
              a.lastCompletedTime -
              b.lastCompletedTime
            );

          }
        );


        /*
          DISPLAY
        */

        if (singers.length === 0) {

          rotation.innerHTML =
            `<div class="empty">
              No other singers waiting.
            </div>`;

          return;
        }


        rotation.innerHTML =
          singers.map(
            (singer, index) => `

              <div class="rotation-row">

                <div class="position">
                  ${index + 1}.
                </div>

                <div class="name">
                  ${escapeHtml(
                    singer.name
                  )}
                </div>

              </div>

            `
          ).join("");

      }

      catch (error) {

        console.error(error);

        rotation.innerHTML =
          `<div class="empty">
            Could not load rotation.
          </div>`;

      }

    }


    loadRotation();


    setInterval(
      loadRotation,
      5000
    );

  </script>

</body>

</html>

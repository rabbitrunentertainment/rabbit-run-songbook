<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Rabbit Run Entertainment | Karaoke Song Book</title>

<style>

:root {
  --pink:#d42fc5;
  --purple:#7b39d9;
  --blue:#2f7eea;
  --ink:#f8f8fb;
  --muted:#b9b8c7;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:
    radial-gradient(circle at 15% 0%,#32104b 0,transparent 35%),
    radial-gradient(circle at 85% 10%,#09285c 0,transparent 38%),
    #050711;
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

.wrap {
  max-width:920px;
  margin:auto;
  padding:28px 18px 60px;
}

header {
  text-align:center;
}

.logo {
  width:min(280px,70vw);
  height:auto;
  filter:drop-shadow(0 0 18px rgba(166,66,255,.25));
}

h1 {
  font-size:clamp(32px,7vw,58px);
  margin:8px 0 4px;
  letter-spacing:.03em;
}

.tag {
  font-size:clamp(18px,4vw,25px);
  color:#e17ce1;
  margin:0 0 28px;
  font-style:italic;
}

.searchbox {
  position:sticky;
  top:0;
  padding:12px 0 14px;
  background:linear-gradient(#050711 70%,transparent);
  z-index:3;
}

input {
  width:100%;
  padding:18px 20px;
  border-radius:18px;
  border:2px solid transparent;

  background:
    linear-gradient(#0c1020,#0c1020) padding-box,
    linear-gradient(90deg,var(--pink),var(--blue)) border-box;

  color:white;
  font-size:19px;
  outline:none;
}

.status {
  color:var(--muted);
  text-align:center;
  margin:10px 0 18px;
  min-height:20px;
}

.results {
  display:grid;
  gap:10px;
}

.song {
  background:rgba(18,22,39,.88);
  border:1px solid #262d49;
  border-radius:14px;
  padding:14px 16px;
}

.song b {
  display:block;
  font-weight:700;
  font-size:18px;
}

.song span {
  display:block;
  color:#c7c9d7;
  margin-top:4px;
}

.song button {
  margin-top:12px;
  padding:10px 15px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.note {
  text-align:center;
  color:var(--muted);
  margin-top:30px;
  font-size:14px;
}

</style>
</head>


<body>

<main class="wrap">

<header>

  <img
    class="logo"
    src="rabbit-run-logo.png"
    alt="Rabbit Run Entertainment"
  >

  <h1>Karaoke Song Book</h1>

  <p class="tag">
    Keepin' the Party Hoppin'
  </p>

</header>


<div class="searchbox">

  <input
    id="q"
    type="search"
    placeholder="Search by artist or song title..."
    autocomplete="off"
  >

</div>


<div id="status" class="status">
  Loading song book…
</div>


<section
  id="results"
  class="results">
</section>


<p class="note">
  Don't see what you're looking for?
  Ask us. We may have another version available.
</p>

</main>


<script>

let songs = [];


const q =
  document.getElementById('q');

const results =
  document.getElementById('results');

const status =
  document.getElementById('status');


const SUPABASE_URL =
  "https://cpprxqlevftbgpjjfgnz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_HeuQI_aKycIu8i8TUBNP-A_7bHnRwp3";


/* =========================
   DEVICE ID
   ========================= */

let singerId =
  localStorage.getItem(
    "rabbitRunSingerId"
  );


if (!singerId) {

  singerId =
    Date.now().toString(36) +
    "-" +
    Math.random()
      .toString(36)
      .substring(2);


  localStorage.setItem(
    "rabbitRunSingerId",
    singerId
  );

}


/* =========================
   REMEMBER CURRENT NAME
   ========================= */

let rememberedSingerName =
  localStorage.getItem(
    "rabbitRunSingerName"
  ) || "";


/* =========================
   REMEMBER ORIGINAL NAME
   ========================= */

let originalSingerName =
  localStorage.getItem(
    "rabbitRunOriginalSingerName"
  ) || "";


/* =========================
   SAFE DISPLAY TEXT
   ========================= */

const escapeHtml = value =>
  String(value ?? "").replace(
    /[&<>"']/g,
    character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[character])
  );


/* =========================
   LOAD SONG BOOK
   ========================= */

fetch('songs.json')

  .then(response => {

    if (!response.ok) {

      throw new Error(
        'Could not load songs.json'
      );

    }

    return response.json();

  })

  .then(data => {

    songs = data;

    status.textContent =
      `${songs.length.toLocaleString()} songs ready to search`;

  })

  .catch(error => {

    console.error(
      "Song book error:",
      error
    );

    status.textContent =
      'Could not load song book.';

  });


/* =========================
   SEARCH SONGS
   ========================= */

function render() {

  const term =
    q.value
      .trim()
      .toLowerCase();


  results.innerHTML = '';


  if (term.length < 2) {

    status.textContent =
      songs.length

        ? `${songs.length.toLocaleString()} songs ready to search`

        : 'Loading song book...';

    return;

  }


  const found = [];


  for (const song of songs) {

    const searchable =
      `${song.artist} ${song.title}`
        .toLowerCase();


    if (
      searchable.includes(term)
    ) {

      found.push(song);


      if (
        found.length >= 100
      ) {

        break;

      }

    }

  }


  status.textContent =
    found.length

      ? `Showing ${found.length}${found.length === 100 ? '+' : ''} matches`

      : 'No matches found';


  results.innerHTML =
    found.map(song => `

      <div class="song">

        <b>
          ${escapeHtml(song.title)}
        </b>

        <span>
          ${escapeHtml(song.artist)}
        </span>

        <button
          onclick='requestSong(
            ${JSON.stringify(song.title)},
            ${JSON.stringify(song.artist)}
          )'
        >
          Request This Song
        </button>

      </div>

    `).join('');

}


/* =========================
   SEND REQUEST TO SUPABASE
   ========================= */

async function submitRequest(
  singerName,
  songTitle,
  artist
) {

  const response =
    await fetch(

      `${SUPABASE_URL}/rest/v1/requests`,

      {

        method:'POST',

        headers: {

          'apikey':
            SUPABASE_KEY,

          'Authorization':
            `Bearer ${SUPABASE_KEY}`,

          'Content-Type':
            'application/json'

        },


        body:JSON.stringify({

          singer_name:
            singerName,

          song_title:
            songTitle,

          artist:
            artist,

          status:
            'waiting',

          singer_id:
            singerId,

          original_name:
            originalSingerName

        })

      }

    );


  if (!response.ok) {

    const errorText =
      await response.text();


    console.error(
      "Supabase request failed:",
      response.status,
      errorText
    );


    throw new Error(
      'Request failed'
    );

  }


  return true;

}


/* =========================
   REQUEST SONG
   ========================= */

async function requestSong(
  title,
  artist
) {

  const singerName =
    prompt(
      'What is your name?',
      rememberedSingerName
    );


  if (!singerName) {
    return;
  }


  const cleanSingerName =
    singerName.trim();


  if (!cleanSingerName) {
    return;
  }


  /*
    ORIGINAL NAME
    IS SAVED ONLY ONCE
  */

  if (!originalSingerName) {

    originalSingerName =
      cleanSingerName;


    localStorage.setItem(
      "rabbitRunOriginalSingerName",
      originalSingerName
    );

  }


  /*
    REMEMBER MOST RECENT NAME
  */

  rememberedSingerName =
    cleanSingerName;


  localStorage.setItem(
    "rabbitRunSingerName",
    rememberedSingerName
  );


  try {

    await submitRequest(
      cleanSingerName,
      title,
      artist
    );


    alert(
      `${title} has been added to the request list!`
    );

  }


  catch (error) {

    console.error(
      error
    );


    alert(
      'Sorry! Your request could not be sent.'
    );

  }

}


/* =========================
   SEARCH DELAY
   ========================= */

let timer;


q.addEventListener(
  'input',
  () => {

    clearTimeout(
      timer
    );


    timer =
      setTimeout(
        render,
        100
      );

  }
);

</script>

</body>

</html>
